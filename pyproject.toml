[project]
name = "upsilon"
version = "0.1.0"
description = "Maximum-likelihood mass fits to LHCb Upsilon(1S,2S,3S) dimuon data (DAH Project F1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "iminuit>=2.25",
    "matplotlib>=3.8",
    "tqdm>=4.70.1",
    "particle>=1.1.1",
    "mplhep>=1.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upsilon"]
